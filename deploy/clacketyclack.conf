# Apache vhost for local play: http://clacketyclack/
#
# Matches the sibling project vhosts (hooked.conf, furballistics.conf) in
# shape. DocumentRoot is the LOCAL mirror under /var/www/html. Never point it
# at the project folder inside the SyncThing tree, because the web root has to
# stay somewhere Apache can always read.
#
# Install:
#   sudo ./deploy/setup-apache.sh
<VirtualHost *:80>
    ServerName clacketyclack
    DocumentRoot /var/www/html/clacketyclack
    <Directory /var/www/html/clacketyclack>
        Require all granted
        AllowOverride All
    </Directory>
</VirtualHost>
